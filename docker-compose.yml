services:
  mongo:
    image: mongo:7.0@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: administrator
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_INITDB_DATABASE: dicecloud
    secrets: [mongo_root_password, mongo_app_password]
    volumes:
      - database:/data/db
      - ./deployment/init-mongo.js:/docker-entrypoint-initdb.d/10-dicecloud.js:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 768m
    cpus: 1
    logging: &logs
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  app:
    image: ${DICECLOUD_IMAGE:-dicecloud:runtime}
    build: {context: ., target: runtime}
    restart: unless-stopped
    init: true
    depends_on:
      mongo: {condition: service_healthy}
    environment:
      ROOT_URL: ${ROOT_URL:-http://127.0.0.1:31080}
      PORT: "3000"
      BIND_IP: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=1536
      RULE_REFERENCE_ENABLED: ${RULE_REFERENCE_ENABLED:-true}
      RULE_REFERENCE_BOOTSTRAP_USER: ${RULE_REFERENCE_BOOTSTRAP_USER:-}
      AURORA_IMPORT_ENABLED: ${AURORA_IMPORT_ENABLED:-false}
      DICECLOUD_STORAGE_PATH: /var/lib/dicecloud
      METEOR_SETTINGS: '{"public":{"environment":"production","disablePatreon":true},"private":{"allowRegistration":${ALLOW_REGISTRATION:-false}}}'
    secrets: [mongo_app_password]
    ports: ["127.0.0.1:${DICECLOUD_PORT:-31080}:3000"]
    volumes: [files:/var/lib/dicecloud]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m,uid=1000,gid=1000"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [backend, egress]
    mem_limit: 2g
    cpus: 2
    logging: *logs
networks:
  backend: {internal: true}
  egress: {}
volumes:
  database: {}
  files: {}
secrets:
  mongo_root_password:
    file: ${DICECLOUD_SECRETS_DIR:?Run deployment/initialize.py first}/mongo_root_password
  mongo_app_password:
    file: ${DICECLOUD_SECRETS_DIR:?Run deployment/initialize.py first}/mongo_app_password
